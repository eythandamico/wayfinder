<!doctype html>
<html lang="en" class="dark h-full antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/wayfinder-icon-white.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wayfinder — Your trading desk, intelligent.</title>
    <meta
      name="description"
      content="An AI-aware trading terminal. Charts, perps, agents, and everything you need to navigate the markets — without leaving the desk."
    />
    <meta property="og:title" content="Wayfinder — Your trading desk, intelligent." />
    <meta
      property="og:description"
      content="An AI-aware trading terminal. Charts, perps, agents, and everything you need to navigate the markets — without leaving the desk."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Preload the heading font so brand type doesn't FOUT on the marketing landing. -->
    <link
      rel="preload"
      href="/fonts/RestartSoft-SemiBold.otf"
      as="font"
      type="font/otf"
      crossorigin="anonymous"
    />
  </head>
  <body class="min-h-full flex flex-col bg-background text-foreground font-sans">
    <div id="root"></div>
    <!--
      Kill stale Service Workers from the previous Next.js deploy.
      next-on-pages registers a SW that intercepts every request and
      can keep serving cached old pages even after the deploy moves
      to Vite. The SW shadows our new index.html on subsequent visits,
      so this script ONLY runs when the user hard-refreshes (which
      bypasses the SW for the document fetch). When that happens we
      unregister every SW, drop every CacheStorage entry, and force
      ONE reload so the user sees the new app immediately — not on
      a second manual refresh. Build marker below also lets us verify
      from View Source that the new HTML actually landed.
    -->
    <meta name="wf-build" content="vite-2026-06-30" />
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;
        var sessionKey = "wf-sw-cleanup-done";
        if (sessionStorage.getItem(sessionKey) === "1") return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          var hadAny = regs.length > 0;
          regs.forEach(function (r) { r.unregister(); });
          var clearCaches = window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve();
          clearCaches.then(function () {
            sessionStorage.setItem(sessionKey, "1");
            if (hadAny) {
              // Found a stale SW — force a clean reload so the user
              // sees the new app on this visit, not the next one.
              window.location.reload();
            }
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
